
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: taskflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_user -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow_user
      SPRING_DATASOURCE_PASSWORD: taskflow_password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t taskflow-backend:${{ github.sha }} .
